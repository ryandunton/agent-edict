# AgentEdict version 2 policy map: a standard policy for everyone, plus group
# policies where configurations should differ. Each managed agent is matched
# separately, and the lowest priority number wins across logged-in users.
# See docs/role-policy.md. Replace the example groups with your own.
version: 2
managed_agents: [codex, claude, cursor]
sync_wsl: false

standard:
  profile: standard
  priority: 100

rules:
  - priority: 10
    profile: contractor-readonly
    description: "Contractors - read-only Codex"
    agents: [codex]
    match_groups:
      windows: ['S-1-5-21-1111111111-2222222222-3333333333-1104', 'entra:3f2a8c1e-5b7d-4e2a-9c1f-0a1b2c3d4e5f', '.\Contractors']
      linux: [contractors]
      darwin: [contractors]

  - priority: 11
    profile: contractor-claude
    description: "Contractors - Claude without MCP servers or shell networking"
    agents: [claude]
    match_groups:
      windows: ['S-1-5-21-1111111111-2222222222-3333333333-1104', 'entra:3f2a8c1e-5b7d-4e2a-9c1f-0a1b2c3d4e5f', '.\Contractors']
      linux: [contractors]
      darwin: [contractors]

  - priority: 20
    profile: engineering
    description: "Engineers - all managed agents"
    agents: [all]
    match_groups:
      windows: ['CORP\SG-Engineers']
      linux: [engineers]
      darwin: [engineers]
